name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  components:
    name: Components and player image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            remote-control/package-lock.json
      - name: Install repository tooling
        run: npm ci
      - name: Install remote-control dependencies
        run: npm ci
        working-directory: ./remote-control
      - name: Run CI
        run: bin/ci
      - name: Build player image
        run: docker build --target prod --tag radiopad-player:ci player
      - name: Verify player image
        run: docker run --rm --interactive --entrypoint sh radiopad-player:ci -c 'set -eu; mpv --version >/dev/null; sh -s' < player/tests/bin/check-url-resolver

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose_file:
          [
            compose.yaml,
            compose.split.yaml,
            "compose.yaml:compose.auth.yaml",
            compose.prod-smoke.yaml,
          ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Run compose integration tests
        run: bin/ci integration ${{ matrix.compose_file }}

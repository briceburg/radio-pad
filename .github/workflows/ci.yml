name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
          enable-cache: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            remote-control/package-lock.json
      - name: Install repository tooling
        run: npm ci
      - name: Install remote-control dependencies
        run: npm ci
        working-directory: ./remote-control
      - name: Run CI
        run: bin/ci

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose_file:
          [
            compose.yaml,
            compose.split.yaml,
            "compose.yaml:compose.auth.yaml",
            compose.prod-smoke.yaml,
          ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Run compose integration tests
        run: bin/ci integration ${{ matrix.compose_file }}

[project]
name = "radio-pad-player"
version = "2025.01.0"
description = "radio-pad player client"
license = "GPL-3.0-or-later"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx2==2.5.0",
  "pyserial==3.5",
  "pyserial-asyncio==0.6",
  "python-mpv-jsonipc==1.2.1",
  "websockets==15.0.1",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.uv]
cache-dir = "tmp/.uv_cache"
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
cache_dir = "tmp/.pytest_cache"

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
cache_dir = "tmp/.mypy_cache"
python_version = "3.13"
mypy_path = "src"
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
pretty = true

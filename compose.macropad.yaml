services:
  player:
    group_add:
      - "${RADIOPAD_MACROPAD_GID:?set RADIOPAD_MACROPAD_GID to the macropad device group id or use bin/dev}"
    environment:
      RADIOPAD_MACROPAD_PORT: /dev/macropad
    devices:
      - "${RADIOPAD_MACROPAD_DEVICE:?set RADIOPAD_MACROPAD_DEVICE to the macropad CDC2 device}:/dev/macropad"

[project]
name = "radio-pad-registry"
version = "2025.01.0"
description = "FastAPI registry and switchboard service for radio-pad"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3",
  "fastapi",
  "fastapi-oidc",
  "httpx2",
  "pydantic",
  "uvicorn[standard]",
]

[dependency-groups]
dev = [
  "hypothesis",
  "moto[s3]",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.uv]
cache-dir = "tmp/.uv_cache"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not performance'"
cache_dir = "tmp/.pytest_cache"
pythonpath = ["src", "tests"]
markers = [
    "functional: marks tests as functional (requires a running server)",
    "performance: marks tests as performance-related",
    "s3: marks tests as S3-backend-specific",
]

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "Q", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
cache_dir = "tmp/.mypy_cache"
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true
pretty = true

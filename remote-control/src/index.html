<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>RadioPad</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="RadioPad" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RadioPad" />

    <script type="module" src="/ionic.esm.js"></script>
    <script type="module" src="/js/app.js"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./assets/icons/favicon-16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="./assets/icons/favicon-256.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/icons/apple-touch-icon-180.png"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="theme-color" content="#31d53d" />
    <link rel="source" href="https://github.com/briceburg/radio-pad" />
  </head>
  <body>
    <ion-app>
      <ion-tabs>
        <!-- navbar -->
        <ion-tab-bar id="main-tab-bar" slot="bottom">
          <ion-tab-button tab="control">
            <ion-icon aria-hidden="true" name="radio-outline"></ion-icon>
            <ion-label>Control</ion-label>
          </ion-tab-button>
          <ion-tab-button tab="listen">
            <ion-icon aria-hidden="true" name="headset-outline"></ion-icon>
            <ion-label>Listen</ion-label>
          </ion-tab-button>
          <ion-tab-button tab="settings">
            <ion-icon aria-hidden="true" name="settings-outline"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-tab-button>
        </ion-tab-bar>

        <ion-tab tab="control">
          <radio-player-tab
            class="ion-page"
            tab-name="control"
          ></radio-player-tab>
        </ion-tab>
        <ion-tab tab="listen">
          <radio-player-tab
            class="ion-page"
            tab-name="listen"
          ></radio-player-tab>
        </ion-tab>

        <!-- settings page -->
        <ion-tab tab="settings">
          <ion-header>
            <ion-toolbar>
              <ion-title size="large" role="heading" aria-level="1">
                Settings
              </ion-title>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <radio-settings></radio-settings>
          </ion-content>
        </ion-tab>
      </ion-tabs>
      <ion-toast id="global-toast"></ion-toast>
    </ion-app>
  </body>
</html>

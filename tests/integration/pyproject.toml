[project]
name = "radio-pad-integration-tests"
version = "2025.01.0"
description = "Integration tests for radio-pad compose topologies"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx2",
  "pytest",
  "pytest-asyncio",
  "websockets",
]

[dependency-groups]
dev = [
  "mypy",
  "ruff",
]

[tool.uv]
cache-dir = "tmp/.uv_cache"
package = false

[tool.pytest.ini_options]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
cache-dir = "tmp/.ruff_cache"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
cache_dir = "tmp/.mypy_cache"
python_version = "3.13"
mypy_path = "."
explicit_package_bases = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
pretty = true
